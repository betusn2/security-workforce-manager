services:
  # Backend API + WebSocket Service
  # Database hébergée sur Railway (MySQL)
  - type: web
    name: security-workforce-backend
    env: node
    region: frankfurt
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node src/server.js
    healthCheckPath: /health
    envVars:
      # Server Configuration
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      
      # Railway MySQL Database (External)
      - key: DB_HOST
        value: nozomi.proxy.rlwy.net
      - key: DB_PORT
        value: 23833
      - key: DB_NAME
        value: railway
      - key: DB_USER
        value: root
      - key: DB_PASSWORD
        value: uRpoqGKauYDRIYymcsApwnBblZJDnykx
      - key: DB_DIALECT
        value: mysql
      - key: DB_SSL
        value: false
      
      # Security (auto-généré)
      - key: JWT_SECRET
        generateValue: true
      - key: REFRESH_TOKEN_SECRET
        generateValue: true
      
      # CORS & WebSocket (mettre à jour après déploiement Vercel)
      - key: FRONTEND_URL
        value: https://your-frontend.vercel.app
      - key: WEB_URL
        value: https://your-frontend.vercel.app
      - key: SOCKET_CORS_ORIGIN
        value: https://your-frontend.vercel.app
      
      # Socket.IO Configuration
      - key: SOCKET_PATH
        value: /socket.io/
      - key: SOCKET_TRANSPORTS
        value: websocket,polling
      - key: SOCKET_PING_TIMEOUT
        value: 60000
      - key: SOCKET_PING_INTERVAL
        value: 25000
      
      # Options
      - key: BYPASS_TIME_WINDOWS
        value: false
      - key: MAX_FILE_SIZE
        value: 10485760
